<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="股票交易與庫存損益管理，含台股盤後報告。" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#11151a" />
    <script>
      try {
        var p = localStorage.getItem('stock-pnl-web/theme')
        var d =
          p === 'dark' ||
          (p !== 'light' &&
            (!window.matchMedia || window.matchMedia('(prefers-color-scheme: dark)').matches))
        document.documentElement.dataset.theme = d ? 'dark' : 'light'
        document.querySelector('meta[name="color-scheme"]').content =
          p === 'dark' || p === 'light' ? p : 'light dark'
        document.querySelector('meta[name="theme-color"]').content = d ? '#11151a' : '#ffffff'
      } catch (e) {}
    </script>
    <title>股票小幫手 — 交易與庫存管理</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
