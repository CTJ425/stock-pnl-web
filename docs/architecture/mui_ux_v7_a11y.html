<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-07: High-Accessibility Console - 極致無障礙高對比控制台</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700&family=Roboto+Mono:wght@700&display=swap" rel="stylesheet">
  <style>
    :root { --mui-bg: #000000; --mui-surface: #121212; --mui-primary: #ffff00; --mui-success: #00ff00; --mui-error: #ff3333; --mui-border: #ffffff; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #ffffff; font-family: 'Roboto', sans-serif; font-size: 14px; }
    .header { background: var(--mui-surface); border-bottom: 2px solid var(--mui-border); padding: 16px; display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 8px; }
    .tab { background: #000; border: 2px solid #fff; color: #fff; padding: 8px 16px; font-weight: 700; cursor: pointer; }
    .tab.active { background: var(--mui-primary); color: #000; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--mui-surface); border: 2px solid var(--mui-border); padding: 20px; border-radius: 4px; margin-bottom: 16px; }
    .table { width: 100%; border-collapse: collapse; font-family: 'Roboto Mono', monospace; font-size: 14px; }
    .table th, .table td { padding: 12px; border-bottom: 1px solid #fff; text-align: right; }
    .table th:first-child, .table td:first-child { text-align: left; }
    .up { color: var(--mui-success); font-weight: 700; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: var(--mui-primary); font-size: 18px; font-weight: 700;">♿ MUI ACCESSIBILITY CONSOLE (UX-07)</div>
    <div class="tabs">
      <button class="tab active" onclick="sw('pnl')">1. 損益與保本價 [Alt+1]</button>
      <button class="tab" onclick="sw('market')">2. 盤後總經 [Alt+2]</button>
      <button class="tab" onclick="sw('admin')">3. 排程日誌 [Alt+3]</button>
    </div>
  </div>

  <div class="container">
    <div id="v-pnl" class="view active">
      <div class="card">
        <h2 style="color: var(--mui-primary); margin-bottom: 12px;">高對比庫存部位與保本價 (WCAG AAA 7:1)</h2>
        <table class="table">
          <thead><tr><th>代碼/名稱</th><th>股數</th><th>成本</th><th>現價</th><th>未實現損益</th><th>保本賣價</th></tr></thead>
          <tbody>
            <tr><td>2330 台積電</td><td>3,000</td><td>840.00</td><td>985.00</td><td class="up">+431,240</td><td style="color: var(--mui-primary);">843.50</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="v-market" class="view">
      <div class="card">
        <h2 style="color: var(--mui-primary);">盤後三大法人與美國 FRED 總經</h2>
        <table class="table">
          <thead><tr><th>指標</th><th>數據</th></tr></thead>
          <tbody><tr><td>外資買賣超</td><td class="up">+NT$ 18.25 億</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="v-admin" class="view">
      <div class="card">
        <h2 style="color: var(--mui-primary);">後台排程運作狀態</h2>
        <table class="table">
          <thead><tr><th>Job Name</th><th>Status</th></tr></thead>
          <tbody><tr><td>twse-chip-batch</td><td class="up">SUCCESS</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
