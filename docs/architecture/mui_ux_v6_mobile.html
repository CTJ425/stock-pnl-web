<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-06: Mobile Bottom Drawer System - 行動端抽屜系統</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --mui-bg: #121212; --mui-surface: #1e1e1e; --mui-primary: #90caf9; --mui-success: #66bb6a; --mui-border: rgba(255,255,255,0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #fff; font-family: 'Roboto', sans-serif; font-size: 13px; padding-bottom: 70px; }
    
    .top-nav { background: var(--mui-surface); padding: 12px 16px; border-bottom: 1px solid var(--mui-border); text-align: center; font-weight: 700; color: var(--mui-primary); }
    .container { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    
    .card { background: var(--mui-surface); border: 1px solid var(--mui-border); padding: 16px; border-radius: 12px; margin-bottom: 12px; }
    .up { color: var(--mui-success); font-weight: 600; }

    /* Bottom Nav Bar */
    .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: var(--mui-surface); border-top: 1px solid var(--mui-border); display: flex; height: 56px; }
    .b-tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #aaa; background: transparent; border: none; font-size: 11px; cursor: pointer; }
    .b-tab.active { color: var(--mui-primary); font-weight: 700; }
  </style>
</head>
<body>
  <div class="top-nav">📱 MUI MOBILE BOTTOM DRAWER (UX-06)</div>

  <div class="container">
    <div id="v-pnl" class="view active">
      <div class="card">
        <div style="font-size: 12px; color: #aaa;">總資產淨值</div>
        <div style="font-size: 24px; font-weight: 700; margin-top: 4px;">NT$ 4,852,140</div>
        <div class="up" style="margin-top: 4px;">▲ +NT$ 412,800 (+9.30%)</div>
      </div>

      <div class="card">
        <div style="display: flex; justify-content: space-between;"><b>2330 台積電</b><span class="up">+17.11%</span></div>
        <div style="font-size: 11px; color: #aaa; margin-top: 4px;">3,000 股 | 保本賣價: NT$ 843.50</div>
      </div>
    </div>

    <div id="v-market" class="view">
      <div class="card">
        <h4>盤後三大法人與美股總經</h4>
        <div style="margin-top: 8px;">外資買賣超: <span class="up">+NT$ 18.25 億</span></div>
        <div>Core CPI (FRED): 3.3% YoY</div>
      </div>
    </div>

    <div id="v-admin" class="view">
      <div class="card">
        <h4>後台排程日誌</h4>
        <div class="up" style="margin-top: 8px;">twse-chip-batch SUCCESS (1,240ms)</div>
      </div>
    </div>
  </div>

  <div class="bottom-nav">
    <button class="b-tab active" onclick="sw('pnl')">📊 損益部位</button>
    <button class="b-tab" onclick="sw('market')">🌐 盤後總經</button>
    <button class="b-tab" onclick="sw('admin')">⚙️ 後台排程</button>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.b-tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
