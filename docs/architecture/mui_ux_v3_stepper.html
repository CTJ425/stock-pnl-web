<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-03: Guided Step-by-Step Flow - 漸進引導式交易精算流程</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --mui-bg: #121212;
      --mui-surface: #1e1e1e;
      --mui-primary: #90caf9;
      --mui-success: #66bb6a;
      --mui-warning: #ffa726;
      --mui-border: rgba(255, 255, 255, 0.12);
      --font-sans: 'Roboto', sans-serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #fff; font-family: var(--font-sans); font-size: 13px; }
    .header { background: var(--mui-surface); padding: 12px 24px; border-bottom: 1px solid var(--mui-border); display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 8px; }
    .tab { background: transparent; border: 1px solid var(--mui-border); color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 12px; }
    .tab.active { background: var(--mui-primary); color: #000; font-weight: 700; }
    .container { max-width: 1000px; margin: 24px auto; padding: 0 16px; }
    .view { display: none; }
    .view.active { display: block; }
    
    /* Stepper UI */
    .stepper { display: flex; justify-content: space-between; margin-bottom: 24px; position: relative; }
    .step { background: var(--mui-surface); border: 1px solid var(--mui-border); padding: 12px 20px; border-radius: 8px; flex: 1; margin: 0 4px; text-align: center; font-weight: 500; }
    .step.active { border-color: var(--mui-primary); color: var(--mui-primary); }

    .card { background: var(--mui-surface); border: 1px solid var(--mui-border); border-radius: 12px; padding: 20px; margin-bottom: 16px; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 10px; border-bottom: 1px solid var(--mui-border); text-align: right; }
    .table th:first-child, .table td:first-child { text-align: left; }
    .up { color: var(--mui-success); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: var(--mui-primary); font-weight: 700;">🧩 MUI STEPPER GUIDED FLOW (UX-03)</div>
    <div class="tabs">
      <button class="tab active" onclick="sw('pnl')">1. 股票損益與保本試算</button>
      <button class="tab" onclick="sw('market')">2. 盤後籌碼與總經</button>
      <button class="tab" onclick="sw('admin')">3. 後台排程監控</button>
    </div>
  </div>

  <div class="container">
    <div id="v-pnl" class="view active">
      <div class="stepper">
        <div class="step active">Step 1: 選擇交易標的與數量</div>
        <div class="step">Step 2: 自動計算手續費與稅</div>
        <div class="step">Step 3: 試算保本價格邊界</div>
      </div>
      <div class="card">
        <h3>當前庫存試算成果</h3>
        <table class="table">
          <thead><tr><th>代碼</th><th>股數</th><th>成本</th><th>現價</th><th>未實現損益</th><th>目標保本價</th></tr></thead>
          <tbody>
            <tr><td>2330 台積電</td><td>3,000</td><td>840.00</td><td>985.00</td><td class="up">+431,240</td><td style="color: var(--mui-warning);">843.50</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="v-market" class="view">
      <div class="card">
        <h3>盤後台股三大法人與美股總經</h3>
        <table class="table">
          <thead><tr><th>指標</th><th>數據</th></tr></thead>
          <tbody>
            <tr><td>外資買賣超</td><td class="up">+NT$ 18.25 億</td></tr>
            <tr><td>Core CPI (FRED)</td><td>3.3% YoY</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="v-admin" class="view">
      <div class="card">
        <h3>後台排程與健康狀態</h3>
        <table class="table">
          <thead><tr><th>排程</th><th>狀態</th></tr></thead>
          <tbody>
            <tr><td>twse-chip-batch</td><td class="up">SUCCESS (1,240ms)</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
