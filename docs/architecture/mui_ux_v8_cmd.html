<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-08: Command-Palette Master Desk - 命令列極速工作站</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --mui-bg: #0e1117; --mui-surface: #161b22; --mui-primary: #58a6ff; --mui-success: #3fb950; --mui-border: #30363d; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #c9d1d9; font-family: 'Roboto', sans-serif; font-size: 13px; }
    .header { background: var(--mui-surface); border-bottom: 1px solid var(--mui-border); padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
    .cmd-input { background: #010409; border: 1px solid var(--mui-primary); color: var(--mui-primary); padding: 8px 16px; border-radius: 6px; font-family: 'Fira Code', monospace; width: 380px; }
    .tabs { display: flex; gap: 6px; }
    .tab { background: transparent; border: 1px solid var(--mui-border); color: #8b949e; padding: 6px 12px; border-radius: 6px; cursor: pointer; }
    .tab.active { background: var(--mui-primary); color: #000; font-weight: 700; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--mui-surface); border: 1px solid var(--mui-border); padding: 20px; border-radius: 8px; margin-bottom: 16px; }
    .table { width: 100%; border-collapse: collapse; font-family: 'Fira Code', monospace; }
    .table th, .table td { padding: 10px; border-bottom: 1px solid var(--mui-border); text-align: right; }
    .table th:first-child, .table td:first-child { text-align: left; }
    .up { color: var(--mui-success); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: var(--mui-primary); font-weight: 700;">⌨️ MUI COMMAND PALETTE DESK (UX-08)</div>
    <input type="text" class="cmd-input" value="CMD> Cmd+K / 按下 B 快速買入 / S 賣出..." readonly>
    <div class="tabs">
      <button class="tab active" onclick="sw('pnl')">1. 損益矩陣</button>
      <button class="tab" onclick="sw('market')">2. 盤後總經</button>
      <button class="tab" onclick="sw('admin')">3. 排程日誌</button>
    </div>
  </div>

  <div class="container">
    <div id="v-pnl" class="view active">
      <div class="card">
        <h3>全熱鍵驅動庫存損益明細 (Command Palette Mode)</h3>
        <table class="table" style="margin-top: 12px;">
          <thead><tr><th>代碼</th><th>股數</th><th>成本</th><th>現價</th><th>未實現損益</th><th>保本價</th></tr></thead>
          <tbody>
            <tr><td>2330 台積電</td><td>3,000</td><td>840.00</td><td>985.00</td><td class="up">+431,240</td><td>843.50</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="v-market" class="view">
      <div class="card">
        <h3>盤後數據與美股 FRED 總經</h3>
        <table class="table">
          <thead><tr><th>指標</th><th>數據</th></tr></thead>
          <tbody><tr><td>外資買賣超</td><td class="up">+NT$ 18.25 億</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="v-admin" class="view">
      <div class="card">
        <h3>後台排程日誌</h3>
        <table class="table">
          <thead><tr><th>Job</th><th>Status</th></tr></thead>
          <tbody><tr><td>twse-chip-batch</td><td class="up">SUCCESS</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
