<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-09: Risk & Alert Operations Deck - 風控與預警戰情儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --mui-bg: #121212; --mui-surface: #1e1e1e; --mui-primary: #ffb74d; --mui-success: #81c784; --mui-error: #e57373; --mui-border: rgba(255,255,255,0.12); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #fff; font-family: 'Roboto', sans-serif; font-size: 13px; }
    .header { background: var(--mui-surface); padding: 12px 24px; border-bottom: 1px solid var(--mui-border); display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 8px; }
    .tab { background: transparent; border: 1px solid var(--mui-border); color: #aaa; padding: 6px 14px; border-radius: 6px; cursor: pointer; }
    .tab.active { background: var(--mui-primary); color: #000; font-weight: 700; }
    .container { max-width: 1100px; margin: 24px auto; padding: 0 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .card { background: var(--mui-surface); border: 1px solid var(--mui-border); padding: 20px; border-radius: 10px; margin-bottom: 16px; }
    .snackbar { background: rgba(255, 183, 77, 0.2); border: 1px solid var(--mui-primary); color: var(--mui-primary); padding: 12px; border-radius: 8px; margin-bottom: 16px; font-weight: 500; }
    .table { width: 100%; border-collapse: collapse; }
    .table th, .table td { padding: 10px; border-bottom: 1px solid var(--mui-border); text-align: right; }
    .table th:first-child, .table td:first-child { text-align: left; }
    .up { color: var(--mui-success); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: var(--mui-primary); font-weight: 700;">⚠️ MUI RISK & ALERT DECK (UX-09)</div>
    <div class="tabs">
      <button class="tab active" onclick="sw('pnl')">1. 風控與保本警示</button>
      <button class="tab" onclick="sw('market')">2. 盤後數據與美股總經</button>
      <button class="tab" onclick="sw('admin')">3. 後台排程監控</button>
    </div>
  </div>

  <div class="container">
    <div id="v-pnl" class="view active">
      <div class="snackbar">⚠️ 警示提醒：2317 鴻海 現價 (185.50) 低於保本賣價 (192.80) 距離 -3.71%</div>
      <div class="card">
        <h3>部位風控與保本邊界監控</h3>
        <table class="table">
          <thead><tr><th>代碼</th><th>股數</th><th>成本</th><th>現價</th><th>未實現損益</th><th>保本賣價</th></tr></thead>
          <tbody>
            <tr><td>2330 台積電</td><td>3,000</td><td>840.00</td><td>985.00</td><td class="up">+431,240</td><td>843.50</td></tr>
          </tbody>
        </table>
      </div>
    </div>

    <div id="v-market" class="view">
      <div class="card">
        <h3>盤後台股籌碼與美股 FRED 總經</h3>
        <table class="table">
          <thead><tr><th>指標</th><th>數據</th></tr></thead>
          <tbody><tr><td>外資買賣超</td><td class="up">+NT$ 18.25 億</td></tr></tbody>
        </table>
      </div>
    </div>

    <div id="v-admin" class="view">
      <div class="card">
        <h3>後台排程日誌與異常檢測</h3>
        <table class="table">
          <thead><tr><th>Job</th><th>Status</th></tr></thead>
          <tbody><tr><td>twse-chip-batch</td><td class="up">SUCCESS</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
