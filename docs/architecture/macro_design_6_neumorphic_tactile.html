<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>總體經濟 - 風格六：新擬物立體風 (Neumorphic & Tactile)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #e2e8f0;
      --text: #334155;
      --text-muted: #64748b;
      --shadow-out: 8px 8px 16px #c4cbd5, -8px -8px 16px #ffffff;
      --shadow-in: inset 4px 4px 8px #c4cbd5, inset -4px -4px 8px #ffffff;
      --accent-red: #e11d48;
      --accent-green: #059669;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 28px; min-height: 100vh; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 28px; }
    .header h1 { font-size: 24px; font-weight: 800; color: var(--text); }
    .neu-tag { background: var(--bg); padding: 6px 14px; border-radius: 20px; box-shadow: var(--shadow-out); font-size: 12px; font-weight: 700; color: #475569; }

    /* At-a-glance Tactile Card Grid */
    .tactile-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-bottom: 32px; }

    .tactile-card { background: var(--bg); border-radius: 20px; padding: 20px; box-shadow: var(--shadow-out); transition: all 0.2s; }
    .tactile-card:hover { transform: translateY(-2px); }

    .card-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .led-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .led-green { background: #10b981; box-shadow: 0 0 8px #10b981; }
    .led-red { background: #f43f5e; box-shadow: 0 0 8px #f43f5e; }

    .tactile-title { font-size: 13px; font-weight: 600; color: var(--text-muted); }
    .tactile-val { font-size: 28px; font-weight: 800; margin: 6px 0; color: var(--text); }
    .tactile-sub { font-size: 12px; font-weight: 600; }

    /* Main Chart Card (Neumorphic Inset) */
    .chart-panel { background: var(--bg); border-radius: 24px; padding: 24px; box-shadow: var(--shadow-out); }
    .chart-inset { background: var(--bg); border-radius: 16px; padding: 16px; box-shadow: var(--shadow-in); height: 320px; }

    .btn-group { display: flex; gap: 12px; margin-bottom: 16px; }
    .neu-btn { background: var(--bg); border: none; padding: 8px 16px; border-radius: 12px; box-shadow: var(--shadow-out); font-weight: 700; color: var(--text); cursor: pointer; transition: all 0.2s; }
    .neu-btn.active { box-shadow: var(--shadow-in); color: #2563eb; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1><i class="fa-solid fa-cube" style="color: #475569;"></i> 總體經濟與籌碼立體戰情板</h1>
    <span class="neu-tag">Style 6: 新擬物立體風 (Neumorphic & Tactile)</span>
  </header>

  <!-- 第一眼重點指標 -->
  <div class="tactile-grid">
    <div class="tactile-card">
      <div class="card-top"><span class="tactile-title">加權指數</span><span class="led-dot led-red"></span></div>
      <div class="tactile-val">23,850</div>
      <div class="tactile-sub" style="color: var(--accent-red);"><i class="fa-solid fa-caret-up"></i> +185.20 (+0.78%)</div>
    </div>

    <div class="tactile-card">
      <div class="card-top"><span class="tactile-title">三大法人合計</span><span class="led-dot led-red"></span></div>
      <div class="tactile-val" style="color: var(--accent-red);">+142.8 億</div>
      <div class="tactile-sub">外資 +98.2 億 | 投信 +51.6 億</div>
    </div>

    <div class="tactile-card">
      <div class="card-top"><span class="tactile-title">美國 CPI (YoY)</span><span class="led-dot led-green"></span></div>
      <div class="tactile-val">2.60%</div>
      <div class="tactile-sub" style="color: var(--accent-green);"><i class="fa-solid fa-caret-down"></i> -0.10% 通膨降溫</div>
    </div>

    <div class="tactile-card">
      <div class="card-top"><span class="tactile-title">聯準會利率</span><span class="led-dot led-green"></span></div>
      <div class="tactile-val">4.62%</div>
      <div class="tactile-sub">目標範圍 4.50-4.75%</div>
    </div>
  </div>

  <!-- 立體圖表區 -->
  <div class="chart-panel">
    <div class="btn-group">
      <button class="neu-btn active" onclick="switchNeuTab('tw')">台股市場與籌碼</button>
      <button class="neu-btn" onclick="switchNeuTab('us')">美國總體經濟</button>
    </div>

    <div class="chart-inset">
      <canvas id="neuChart"></canvas>
    </div>
  </div>

  <script>
    const ctx = document.getElementById('neuChart').getContext('2d');
    let chart = new Chart(ctx, {
      type: 'bar',
      data: {
        labels: ['8/01', '8/02', '8/05', '8/06', '8/07', '8/08', '8/11'],
        datasets: [{
          label: '外資買賣超 (億)',
          data: [-120, -210, 85, 110, 65, 40, 98.2],
          backgroundColor: (ctx) => ctx.raw >= 0 ? '#f43f5e' : '#10b981',
          borderRadius: 6
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { labels: { color: '#475569' } } },
        scales: {
          x: { ticks: { color: '#64748b' }, grid: { display: false } },
          y: { ticks: { color: '#64748b' }, grid: { color: '#cbd5e1' } }
        }
      }
    });

    function switchNeuTab(tab) {
      document.querySelectorAll('.neu-btn').forEach(btn => btn.classList.remove('active'));
      event.currentTarget.classList.add('active');

      if(tab === 'tw') {
        chart.data.labels = ['8/01', '8/02', '8/05', '8/06', '8/07', '8/08', '8/11'];
        chart.data.datasets = [{
          label: '外資買賣超 (億)',
          data: [-120, -210, 85, 110, 65, 40, 98.2],
          backgroundColor: (ctx) => ctx.raw >= 0 ? '#f43f5e' : '#10b981',
          borderRadius: 6
        }];
      } else {
        chart.data.labels = ['2026-03', '2026-04', '2026-05', '2026-06', '2026-07', '2026-08'];
        chart.data.datasets = [{
          label: '美國 CPI 年增率 (%)',
          data: [3.1, 2.9, 2.8, 2.7, 2.7, 2.6],
          backgroundColor: '#2563eb',
          borderRadius: 6
        }];
      }
      chart.update();
    }
  </script>
</body>
</html>
