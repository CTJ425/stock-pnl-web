<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>總體經濟 - 風格四：現代 Bento 盒與儀表盤 (Bento Grid & Gauges)</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
      --bg: #090d16;
      --bento-bg: #111827;
      --bento-border: #1f2937;
      --text: #f9fafb;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --accent-green: #10b981;
      --accent-red: #ef4444;
      --accent-amber: #f59e0b;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 24px; min-height: 100vh; }

    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
    .bento-badge { background: rgba(59, 130, 246, 0.15); border: 1px solid var(--accent); color: var(--accent); padding: 4px 12px; border-radius: 8px; font-size: 12px; font-weight: 600; }

    /* Bento Grid System */
    .bento-container { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
    @media (max-width: 1024px) { .bento-container { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 640px) { .bento-container { grid-template-columns: 1fr; } }

    .bento-item { background: var(--bento-bg); border: 1px solid var(--bento-border); border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
    .span-2 { grid-column: span 2; }
    .span-4 { grid-column: span 4; }

    /* Semi-circular Gauge CSS */
    .gauge-wrapper { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; padding-top: 10px; }
    .gauge-svg { width: 140px; height: 75px; }
    .gauge-bg { fill: none; stroke: #1f2937; stroke-width: 14; stroke-linecap: round; }
    .gauge-fill { fill: none; stroke: var(--accent); stroke-width: 14; stroke-linecap: round; stroke-dasharray: 188; stroke-dashoffset: 60; transition: stroke-dashoffset 1s ease; }
    .gauge-val { position: absolute; bottom: 0; font-size: 20px; font-weight: 800; }

    .bento-title { font-size: 13px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 12px; display: flex; justify-content: space-between; }
    .big-num { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 4px; }
    
    .chip-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .chip-row:last-child { border-bottom: none; }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <h1><i class="fa-solid fa-shapes" style="color: var(--accent);"></i> 總體經濟 Bento 計量儀表板</h1>
    <span class="bento-badge">Style 4: Bento 盒與儀表盤 (Bento Grid)</span>
  </header>

  <!-- Bento Grid -->
  <div class="bento-container">
    
    <!-- Bento 1: 台股今日點數 (Span 2) -->
    <div class="bento-item span-2">
      <div class="bento-title"><span>台股加權指數 (TAIEX)</span><span>市場狀態：強勢</span></div>
      <div class="big-num" style="color: #f87171;">23,850.20</div>
      <div style="font-size: 14px; color: #f87171; font-weight: 600; margin-top: 6px;">
        <i class="fa-solid fa-arrow-trend-up"></i> +185.20 (+0.78%) | 成交量 4,120 億
      </div>
    </div>

    <!-- Bento 2: 聯準會利率儀表盤 (Span 1) -->
    <div class="bento-item">
      <div class="bento-title"><span>美聯準會目標利率</span></div>
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 100 50">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fill" d="M 10 50 A 40 40 0 0 1 90 50" style="stroke: var(--accent-amber); stroke-dashoffset: 45;" />
        </svg>
        <div class="gauge-val">4.62%</div>
      </div>
      <div style="text-align: center; font-size: 11px; color: var(--text-muted); margin-top: 8px;">目標 4.50% - 4.75%</div>
    </div>

    <!-- Bento 3: 通膨目標儀表盤 (Span 1) -->
    <div class="bento-item">
      <div class="bento-title"><span>CPI 通膨距離 2% 目標</span></div>
      <div class="gauge-wrapper">
        <svg class="gauge-svg" viewBox="0 0 100 50">
          <path class="gauge-bg" d="M 10 50 A 40 40 0 0 1 90 50" />
          <path class="gauge-fill" d="M 10 50 A 40 40 0 0 1 90 50" style="stroke: var(--accent-green); stroke-dashoffset: 95;" />
        </svg>
        <div class="gauge-val">2.60%</div>
      </div>
      <div style="text-align: center; font-size: 11px; color: var(--accent-green); margin-top: 8px;">差距僅 +0.60%</div>
    </div>

    <!-- Bento 4: 三大法人籌碼矩陣 (Span 2) -->
    <div class="bento-item span-2">
      <div class="bento-title"><span>三大法人籌碼分佈 (TWD)</span><span>更新時間：今日盤後</span></div>
      <div class="chip-row">
        <span>外資淨買賣</span>
        <strong style="color: #f87171;">+98.2 億 (連 3 買)</strong>
      </div>
      <div class="chip-row">
        <span>投信淨買賣</span>
        <strong style="color: #f87171;">+51.6 億 (連 12 買)</strong>
      </div>
      <div class="chip-row">
        <span>自營商淨買賣</span>
        <strong style="color: #34d399;">-7.0 億 (連 2 賣)</strong>
      </div>
    </div>

    <!-- Bento 5: 宏觀圖表 (Span 2) -->
    <div class="bento-item span-2">
      <div class="bento-title"><span>非農就業 vs 失業率軌跡</span></div>
      <div style="height: 140px;">
        <canvas id="bentoChart"></canvas>
      </div>
    </div>

  </div>

  <script>
    const ctx = document.getElementById('bentoChart').getContext('2d');
    new Chart(ctx, {
      type: 'line',
      data: {
        labels: ['3月', '4月', '5月', '6月', '7月', '8月'],
        datasets: [{
          label: '非農就業增加 (千人)',
          data: [180, 165, 150, 140, 125, 143],
          borderColor: '#3b82f6',
          backgroundColor: 'rgba(59, 130, 246, 0.1)',
          fill: true,
          tension: 0.3
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: '#9ca3af' }, grid: { display: false } },
          y: { ticks: { color: '#9ca3af' }, grid: { color: '#1f2937' } }
        }
      }
    });
  </script>
</body>
</html>
