<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三大法人 - 行動版折疊過濾</title>
  <!--
    Concept: Mobile-first accordion + swipe
    Fixes: Mobile horizontal scrolling table. Uses unit chips as a global filter to avoid horizontal scroll entirely.
    Trade-offs: Cannot see multiple units side-by-side easily on desktop.
    Cost: Low (simple layout with filter state).
  -->
  <style>
    :root {
      --tv-bg-main: #ffffff;
      --tv-bg-panel: #f8f9fa;
      --tv-bg-hover: #f1f3f5;
      --tv-border: #e9ecef;
      --tv-text: #212529;
      --tv-text-muted: #868e96;
      --tv-up: #f23645;
      --tv-down: #089981;
      --tv-blue: #2962ff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --tv-bg-main: #131722;
        --tv-bg-panel: #1e222d;
        --tv-bg-hover: #2a2e39;
        --tv-border: #2a2e39;
        --tv-text: #d1d4dc;
        --tv-text-muted: #787b86;
      }
    }
    body { background: var(--tv-bg-main); color: var(--tv-text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; margin: 0; padding: 0; font-size: 15px; }
    .up { color: var(--tv-up); }
    .down { color: var(--tv-down); }
    
    .mobile-container { max-width: 480px; margin: 0 auto; background: var(--tv-bg-panel); min-height: 100vh; border-left: 1px solid var(--tv-border); border-right: 1px solid var(--tv-border); }
    .header { padding: 16px; border-bottom: 1px solid var(--tv-border); background: var(--tv-bg-main); }
    
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px; background: var(--tv-bg-main); -webkit-overflow-scrolling: touch; border-bottom: 1px solid var(--tv-border); }
    .chips::-webkit-scrollbar { display: none; }
    .chip { padding: 6px 16px; background: var(--tv-bg-panel); border: 1px solid var(--tv-border); border-radius: 20px; white-space: nowrap; cursor: pointer; transition: 0.2s; font-size: 14px; }
    .chip.active { background: var(--tv-blue); color: white; border-color: var(--tv-blue); }
    
    .list { padding: 0; }
    .mob-card { padding: 16px; border-bottom: 1px solid var(--tv-border); background: var(--tv-bg-main); }
    .mob-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .mob-date { font-weight: bold; font-size: 16px; }
    .mob-net { font-size: 20px; font-weight: bold; }
    .mob-legs { display: flex; justify-content: space-between; font-size: 13px; color: var(--tv-text-muted); background: var(--tv-bg-panel); padding: 12px; border-radius: 8px; }
  </style>
</head>
<body>
  <div class="mobile-container">
    <div class="header">
      <h2 style="margin:0; font-size:18px;">三大法人買賣超</h2>
    </div>
    
    <div class="chips" id="chipsArea" role="tablist"></div>
    <div class="list" id="listArea" role="tabpanel"></div>
  </div>
  <script>
    const UNITS = [
      { key: 'total', label: '合計' },
      { key: 'foreign', label: '外資' },
      { key: 'foreignDealer', label: '外資自營商' },
      { key: 'trust', label: '投信' },
      { key: 'dealerSelf', label: '自營商(自行)' },
      { key: 'dealerHedge', label: '自營商(避險)' }
    ];
    const MOCK_DATA = [
      { date: '07/31', foreign: -156.4, foreignDealer: -1.2, trust: 35.6, dealerSelf: -10.5, dealerHedge: -40.2, total: -172.7, buy: 1300, sell: 1472.7 },
      { date: '08/01', foreign: -200.5, foreignDealer: 0.8, trust: 22.4, dealerSelf: -15.1, dealerHedge: -55.8, total: -248.2, buy: null, sell: null },
      { date: '08/04', foreign: -450.2, foreignDealer: -5.4, trust: 60.5, dealerSelf: -30.2, dealerHedge: -120.4, total: -545.7, buy: 1800, sell: 2345.7 },
      { date: '08/05', foreign: 120.5, foreignDealer: 2.1, trust: 45.2, dealerSelf: 8.5, dealerHedge: -15.2, total: 161.1, buy: 1400.8, sell: 1239.7 },
      { date: '08/06', foreign: 235.8, foreignDealer: -1.5, trust: 15.6, dealerSelf: 22.4, dealerHedge: 18.5, total: 290.8, buy: 1550.4, sell: 1259.6 },
      { date: '08/07', foreign: -50.4, foreignDealer: 0.5, trust: 10.2, dealerSelf: -5.6, dealerHedge: -12.4, total: -57.7, buy: 1100.0, sell: 1157.7 },
      { date: '08/08', foreign: 85.2, foreignDealer: 1.2, trust: 28.5, dealerSelf: 12.0, dealerHedge: 5.4, total: 132.3, buy: 1200.0, sell: 1067.7 }
    ].reverse();

    function renderView(activeKey) {
      let chipsHtml = '';
      UNITS.forEach(u => {
        chipsHtml += `<div class="chip ${u.key === activeKey ? 'active' : ''}" onclick="renderView('${u.key}')" role="tab" aria-selected="${u.key === activeKey}">${u.label}</div>`;
      });
      document.getElementById('chipsArea').innerHTML = chipsHtml;
      
      let listHtml = '';
      MOCK_DATA.forEach(d => {
        let net = d[activeKey];
        let hasLegs = d.buy !== null;
        let uBuy = hasLegs ? (Math.abs(net) * 2.5 + (net > 0 ? net : 0)) : null;
        let uSell = hasLegs ? (Math.abs(net) * 2.5 - (net < 0 ? net : 0)) : null;
        
        let buyStr = hasLegs ? `買進 ${uBuy.toFixed(1)} 億` : '買進 —';
        let sellStr = hasLegs ? `賣出 ${uSell.toFixed(1)} 億` : '賣出 —';
        
        listHtml += `<div class="mob-card">
           <div class="mob-header">
             <span class="mob-date">${d.date}</span>
             <span class="mob-net ${net > 0 ? 'up' : 'down'}">${net > 0 ? '+' : ''}${net.toFixed(1)}</span>
           </div>
           <div class="mob-legs">
             <span>${buyStr}</span>
             <span>${sellStr}</span>
           </div>
        </div>`;
      });
      document.getElementById('listArea').innerHTML = listHtml;
    }
    
    renderView('total');
  </script>
</body>
</html>
