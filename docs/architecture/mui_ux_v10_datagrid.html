<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MUI UX-10: Dense Financial DataGrid Pro - 專業級試算表格</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;600&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --mui-bg: #0a0e17; --mui-surface: #131a29; --mui-primary: #90caf9; --mui-success: #66bb6a; --mui-border: rgba(255,255,255,0.1); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--mui-bg); color: #fff; font-family: 'Roboto', sans-serif; font-size: 12px; }
    .header { background: var(--mui-surface); padding: 10px 20px; border-bottom: 1px solid var(--mui-border); display: flex; justify-content: space-between; align-items: center; }
    .tabs { display: flex; gap: 6px; }
    .tab { background: transparent; border: 1px solid var(--mui-border); color: #aaa; padding: 4px 12px; border-radius: 4px; cursor: pointer; }
    .tab.active { background: var(--mui-primary); color: #000; font-weight: 700; }
    .content { padding: 16px; }
    .view { display: none; }
    .view.active { display: block; }
    .datagrid { width: 100%; border-collapse: collapse; font-family: 'Roboto Mono', monospace; }
    .datagrid th { background: #1c263b; color: #90caf9; padding: 8px 12px; border: 1px solid var(--mui-border); text-align: right; }
    .datagrid th:first-child, .datagrid td:first-child { text-align: left; position: sticky; left: 0; background: #131a29; }
    .datagrid td { padding: 8px 12px; border: 1px solid rgba(255,255,255,0.05); text-align: right; }
    .up { color: var(--mui-success); font-weight: 600; }
  </style>
</head>
<body>
  <div class="header">
    <div style="color: var(--mui-primary); font-weight: 700;">📊 MUI DATAGRID PRO MATRIX (UX-10)</div>
    <div class="tabs">
      <button class="tab active" onclick="sw('pnl')">1. 股票交易與損益數據網格</button>
      <button class="tab" onclick="sw('market')">2. 盤後籌碼與美股總經</button>
      <button class="tab" onclick="sw('admin')">3. 後台排程運作狀況</button>
    </div>
  </div>

  <div class="content">
    <div id="v-pnl" class="view active">
      <table class="datagrid">
        <thead>
          <tr><th>代碼/名稱 (Pinned)</th><th>股數</th><th>均價</th><th>現價</th><th>市值</th><th>未實現損益</th><th>報酬率</th><th>賣出手續費</th><th>證交稅</th><th>保本賣價</th></tr>
        </thead>
        <tbody>
          <tr><td>2330 台積電</td><td>3,000</td><td>840.00</td><td>985.00</td><td>2,955,000</td><td class="up">+431,240</td><td class="up">+17.11%</td><td>2,526</td><td>8,865</td><td>843.50</td></tr>
        </tbody>
      </table>
    </div>

    <div id="v-market" class="view">
      <table class="datagrid">
        <thead><tr><th>指標</th><th>數據</th></tr></thead>
        <tbody><tr><td>外資買賣超</td><td class="up">+NT$ 18.25 億</td></tr></tbody>
      </table>
    </div>

    <div id="v-admin" class="view">
      <table class="datagrid">
        <thead><tr><th>Task Name</th><th>Status</th></tr></thead>
        <tbody><tr><td>twse-chip-batch</td><td class="up">SUCCESS</td></tr></tbody>
      </table>
    </div>
  </div>

  <script>
    function sw(id) {
      document.querySelectorAll('.tab').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('v-' + id).classList.add('active');
    }
  </script>
</body>
</html>
