<title>當日大盤面板</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">

<style>
/* ── Tokens lifted verbatim from sources/src/index.css ─────────────────────
   The app is dark-first, so the bare :root carries the dark set and the light
   set is applied for an explicit light choice or a light OS preference.       */
:root {
  --bg: #0b0f19;
  --bg-glow-a: rgba(99, 102, 241, 0.16);
  --bg-glow-b: rgba(34, 211, 238, 0.1);
  --surface: rgba(255, 255, 255, 0.045);
  --surface-strong: rgba(255, 255, 255, 0.08);
  --border: rgba(255, 255, 255, 0.09);
  --border-strong: rgba(255, 255, 255, 0.16);
  --ink: #e7ecf5;
  --ink-secondary: #9aa6bd;
  --ink-muted: #64748b;
  --accent: #7c8cf8;
  --accent-strong: #6366f1;
  --accent-2: #22d3ee;
  --up: #ff4a5a;
  --down: #00e676;
  --radius: 14px;
  --radius-sm: 9px;
  --font-display: 'Outfit', 'Noto Sans TC', sans-serif;
  --font-body: 'Inter', 'Noto Sans TC', 'Microsoft JhengHei', sans-serif;
  --shadow-card: 0 8px 32px rgba(2, 6, 18, 0.45);
  --row-alt: rgba(255, 255, 255, 0.02);
  --thead-bg: rgba(255, 255, 255, 0.03);
  --grid: rgba(255, 255, 255, 0.06);
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme='dark']) {
    --bg: #eef2f9;
    --bg-glow-a: rgba(99, 102, 241, 0.12);
    --bg-glow-b: rgba(34, 211, 238, 0.1);
    --surface: rgba(255, 255, 255, 0.66);
    --surface-strong: rgba(255, 255, 255, 0.9);
    --border: rgba(15, 23, 42, 0.08);
    --border-strong: rgba(15, 23, 42, 0.16);
    --ink: #17202f;
    --ink-secondary: #4a586e;
    --ink-muted: #7b8698;
    --accent: #5b6cf0;
    --accent-strong: #4f46e5;
    --up: #dc2f3f;
    --down: #059654;
    --shadow-card: 0 8px 28px rgba(15, 23, 42, 0.08);
    --row-alt: rgba(15, 23, 42, 0.02);
    --thead-bg: rgba(15, 23, 42, 0.03);
    --grid: rgba(15, 23, 42, 0.07);
  }
}
:root[data-theme='light'] {
  --bg: #eef2f9;
  --bg-glow-a: rgba(99, 102, 241, 0.12);
  --bg-glow-b: rgba(34, 211, 238, 0.1);
  --surface: rgba(255, 255, 255, 0.66);
  --surface-strong: rgba(255, 255, 255, 0.9);
  --border: rgba(15, 23, 42, 0.08);
  --border-strong: rgba(15, 23, 42, 0.16);
  --ink: #17202f;
  --ink-secondary: #4a586e;
  --ink-muted: #7b8698;
  --accent: #5b6cf0;
  --accent-strong: #4f46e5;
  --up: #dc2f3f;
  --down: #059654;
  --shadow-card: 0 8px 28px rgba(15, 23, 42, 0.08);
  --row-alt: rgba(15, 23, 42, 0.02);
  --thead-bg: rgba(15, 23, 42, 0.03);
  --grid: rgba(15, 23, 42, 0.07);
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background-color: var(--bg);
  background-image:
    radial-gradient(1000px 520px at 85% -10%, var(--bg-glow-a), transparent 60%),
    radial-gradient(900px 480px at -10% 30%, var(--bg-glow-b), transparent 55%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 14px;
  line-height: 1.55;
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { margin: 0; font-family: var(--font-display); text-wrap: balance; }

/* ── Review toolbar — deliberately not part of the app ───────────────────── */
.review {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px;
  padding: 10px 20px;
  border-bottom: 1px dashed var(--border-strong);
  background: var(--thead-bg);
}
.review .tag {
  font-family: var(--font-display); font-size: 11px; font-weight: 600;
  letter-spacing: 0.09em; text-transform: uppercase; color: var(--ink-muted);
  margin-right: auto;
}
.review button {
  appearance: none; font: inherit; font-size: 12px; cursor: pointer;
  color: var(--ink-secondary); background: var(--surface);
  border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px;
  transition: color .18s ease, border-color .18s ease, background .18s ease;
}
.review button:hover { color: var(--ink); border-color: var(--border-strong); }
.review button[aria-pressed='true'] { color: var(--accent); border-color: var(--accent); }
.review button:focus-visible,
.subtab:focus-visible,
.rangebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ── App frame ───────────────────────────────────────────────────────────── */
.app { max-width: 1080px; margin: 0 auto; padding: 0 20px 64px; }
.crumb {
  font-size: 12px; color: var(--ink-muted); padding: 18px 0 10px;
  display: flex; align-items: center; gap: 7px;
}
.crumb b { color: var(--ink-secondary); font-weight: 500; }

.subtabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
.subtab {
  appearance: none; border: none; background: transparent; color: var(--ink-secondary);
  font: inherit; font-weight: 500; padding: 8px 14px; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
  transition: color .18s ease, border-color .18s ease;
}
.subtab.active { color: var(--accent); border-bottom-color: var(--accent); }

.section { margin-top: 22px; position: relative; }
.glass {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px); box-shadow: var(--shadow-card);
}
.section-title { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.section-title h2 { font-size: 16px; color: var(--ink); display: flex; align-items: center; gap: 8px; }
.section-title .hint { color: var(--ink-muted); font-size: 12px; }

/* origin chips, toggled from the review bar */
.chip {
  position: absolute; top: -9px; right: 12px; z-index: 2;
  font-family: var(--font-display); font-size: 10px; font-weight: 600;
  letter-spacing: .07em; padding: 2px 9px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--bg); color: var(--ink-muted);
  opacity: 0; transition: opacity .2s ease;
}
.chip.is-new { color: var(--accent); border-color: var(--accent); }
body.mark .chip { opacity: 1; }
body.mark #newBlock > .glass { outline: 1px dashed var(--accent); outline-offset: 3px; }

/* ── The new panel ───────────────────────────────────────────────────────── */
.panel { padding: 18px 20px 14px; }
.phead { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
.pname { display: flex; align-items: center; gap: 9px; }
.pname h2 { font-size: 17px; }
.badge {
  font-size: 11px; font-weight: 600; letter-spacing: .04em;
  padding: 2px 8px; border-radius: 6px;
  color: var(--accent); background: var(--surface-strong); border: 1px solid var(--border);
}
.chart-time-badge {
  font-size: 12px; color: var(--ink-secondary); background: var(--surface-strong);
  border: 1px solid var(--border); padding: 2px 8px; border-radius: 6px;
  display: inline-flex; align-items: center; gap: 6px; font-weight: 500;
}
.hero { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin: 10px 0 4px; }
.hero .val {
  font-family: var(--font-display); font-size: clamp(34px, 6vw, 46px);
  font-weight: 700; line-height: 1; letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
}
.hero .chg { font-size: 17px; font-weight: 600; font-variant-numeric: tabular-nums; }
.up { color: var(--up); }
.down { color: var(--down); }
.flat { color: var(--ink-secondary); }

.ranges { display: flex; gap: 4px; margin: 12px 0 6px; }
.rangebtn {
  appearance: none; font: inherit; font-size: 12px; font-weight: 500; cursor: pointer;
  color: var(--ink-secondary); background: transparent;
  border: 1px solid var(--border); border-radius: 999px; padding: 4px 14px;
  transition: color .18s ease, border-color .18s ease, background .18s ease;
}
.rangebtn[aria-pressed='true'] { color: var(--accent); border-color: var(--accent); background: var(--surface-strong); }

.chartwrap { position: relative; margin-top: 4px; }
.chartwrap svg { display: block; width: 100%; height: 250px; }
.ylab {
  position: absolute; right: 2px; transform: translateY(-50%);
  font-size: 10.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums;
  background: var(--bg); padding: 0 3px; pointer-events: none;
}
.xrow { position: relative; height: 16px; margin-top: 4px; }
.xlab {
  position: absolute; transform: translateX(-50%); white-space: nowrap;
  font-size: 10.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums;
}
@keyframes ping { 0% { r: 3.5; opacity: .55; } 100% { r: 11; opacity: 0; } }
.pingring { animation: ping 1.9s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .pingring { animation: none; opacity: 0; } }

/* stats grid — same construction as .m-stats in the app */
.m-stats {
  display: grid; grid-template-columns: repeat(3, 1fr);
  border-top: 1px solid var(--border); border-left: 1px solid var(--border);
  border-radius: var(--radius-sm); overflow: hidden; margin-top: 14px;
}
.m-stats .cell {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  padding: 8px 12px; background: var(--row-alt);
  border-right: 1px solid var(--border); border-bottom: 1px solid var(--border);
}
.m-stats .k { font-size: 11px; color: var(--ink-muted); }
.m-stats .v { font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.note { font-size: 11.5px; color: var(--ink-muted); margin-top: 9px; }

/* ── Existing blocks below ───────────────────────────────────────────────── */
.kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
.kpi { padding: 16px 18px; position: relative; overflow: hidden; }
.kpi::before {
  content: ''; position: absolute; inset: 0 auto auto 0; width: 100%; height: 2px;
  background: linear-gradient(90deg, var(--accent-strong), var(--accent-2), transparent);
  opacity: .7;
}
.kpi .k { font-size: 11px; color: var(--ink-muted); }
.kpi .v { font-family: var(--font-display); font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .s { font-size: 11.5px; color: var(--ink-secondary); font-variant-numeric: tabular-nums; }
.pad { padding: 16px 18px; }
.stub {
  border: 1px dashed var(--border); border-radius: var(--radius-sm);
  padding: 14px 16px; color: var(--ink-muted); font-size: 12.5px;
}
footer { max-width: 1080px; margin: 0 auto; padding: 8px 20px 40px; color: var(--ink-muted); font-size: 11.5px; }
footer code { font-size: 11px; color: var(--ink-secondary); }

@media (max-width: 620px) {
  .m-stats { grid-template-columns: repeat(2, 1fr); }
  .app { padding: 0 14px 48px; }
  .panel { padding: 15px 15px 12px; }
}
</style>

<div class="review">
  <span class="tag">設計稿 · 資料為 2026-08-26 實際盤中數字</span>
  <button type="button" id="markBtn" aria-pressed="true">標示新增區塊</button>
  <button type="button" id="themeBtn" aria-pressed="false">切換淺色</button>
</div>

<div class="app">
  <div class="crumb">總體經濟 <span aria-hidden="true">›</span> <b>台股</b></div>

  <div class="subtabs" role="tablist" aria-label="總體經濟分類">
    <button type="button" role="tab" class="subtab active" aria-selected="true">台股</button>
    <button type="button" role="tab" class="subtab" aria-selected="false">美國經濟</button>
  </div>

  <!-- ───────────── NEW ───────────── -->
  <section class="section" id="newBlock" aria-labelledby="newHead">
    <span class="chip is-new">新增</span>
    <div class="glass panel">
      <div class="phead">
        <div class="pname">
          <h2 id="newHead">加權指數</h2>
          <span class="badge">當日</span>
        </div>
        <span class="chart-time-badge"><span id="asOf">—</span> 更新</span>
      </div>

      <div class="hero">
        <span class="val" id="heroVal">—</span>
        <span class="chg" id="heroChg">—</span>
      </div>

      <div class="ranges" role="group" aria-label="區間">
        <button type="button" class="rangebtn" data-range="d1" aria-pressed="true">1日</button>
        <button type="button" class="rangebtn" data-range="d5" aria-pressed="false">5日</button>
      </div>

      <div class="chartwrap" id="chartWrap">
        <svg id="chart" viewBox="0 0 1000 250" preserveAspectRatio="none" role="img"
             aria-label="加權指數分時走勢，昨收為基準線"></svg>
      </div>
      <div class="xrow" id="xrow"></div>

      <div class="m-stats" id="stats"></div>
      <p class="note" id="statNote"></p>
    </div>
  </section>

  <!-- ───────────── EXISTING ───────────── -->
  <section class="section" aria-label="最近交易日指標">
    <span class="chip">既有</span>
    <div class="section-title">
      <h2>市場指標</h2>
      <span class="hint" id="kpiDate">—</span>
    </div>
    <div class="kpi-grid" id="kpis"></div>
  </section>

  <section class="section" aria-label="加權指數日線">
    <span class="chip">既有</span>
    <div class="glass pad">
      <div class="section-title">
        <h2>加權指數日線</h2>
        <span class="hint">近 30 個交易日</span>
      </div>
      <svg id="candles" viewBox="0 0 1000 220" preserveAspectRatio="none" role="img"
           aria-label="加權指數近 30 日 K 線" style="display:block;width:100%;height:200px"></svg>
      <div class="section-title" style="margin:16px 0 8px">
        <h2 style="font-size:14px">成交金額</h2>
        <span class="hint">億元</span>
      </div>
      <svg id="turnover" viewBox="0 0 1000 80" preserveAspectRatio="none" role="img"
           aria-label="每日成交金額" style="display:block;width:100%;height:74px"></svg>
    </div>
  </section>

  <section class="section" aria-label="法人與成交統計表">
    <span class="chip">既有</span>
    <div class="glass pad">
      <div class="stub">三大法人買賣超表 · 成交統計表 —— 維持現狀，此稿不更動</div>
    </div>
  </section>
</div>

<footer>
  走勢與開高低昨收來自 Yahoo chart v8 <code>^TWII</code>；市場指標與日線來自
  <code>reports/market/daily.json</code>。當日格刻意不放成交金額 —— Yahoo 對指數不提供，
  它留在下方「市場指標」並標明是最近交易日。
</footer>

const nf = (n, d = 2) => n === null || n === undefined || !isFinite(n)
  ? '—' : n.toLocaleString('zh-TW', { minimumFractionDigits: d, maximumFractionDigits: d });
const oku = (v) => nf(v / 1e8, 0);
const sign = (v) => (v > 0 ? '+' : '');
const dirClass = (v) => (v === null ? 'flat' : v > 0 ? 'up' : v < 0 ? 'down' : 'flat');
const cssVar = (n) => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

let range = 'd1';

function drawChart() {
  const s = D[range], closes = s.c, prev = D.prev;
  const svg = document.getElementById('chart');
  const W = 1000, H = 250;
  let lo = Math.min(prev, ...closes), hi = Math.max(prev, ...closes);
  const pad = (hi - lo) * 0.1 || 1; lo -= pad; hi += pad;
  const X = (i) => (i * W) / (closes.length - 1);
  const Y = (v) => H - ((v - lo) * H) / (hi - lo);
  const baseY = Y(prev);
  const last = closes[closes.length - 1];
  const upNow = last >= prev;
  const stroke = upNow ? cssVar('--up') : cssVar('--down');

  const line = closes.map((c, i) => `${X(i).toFixed(2)},${Y(c).toFixed(2)}`).join(' ');
  const area = `M0,${Y(closes[0]).toFixed(2)} ` +
    closes.map((c, i) => `L${X(i).toFixed(2)},${Y(c).toFixed(2)}`).join(' ') +
    ` L${W},${baseY.toFixed(2)} L0,${baseY.toFixed(2)} Z`;

  svg.innerHTML = `
    <defs>
      <clipPath id="clipUp"><rect x="0" y="0" width="${W}" height="${Math.max(0, baseY)}"/></clipPath>
      <clipPath id="clipDown"><rect x="0" y="${baseY}" width="${W}" height="${Math.max(0, H - baseY)}"/></clipPath>
      <linearGradient id="gUp" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="${cssVar('--up')}" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="${cssVar('--up')}" stop-opacity="0.02"/>
      </linearGradient>
      <linearGradient id="gDown" x1="0" y1="1" x2="0" y2="0">
        <stop offset="0%" stop-color="${cssVar('--down')}" stop-opacity="0.30"/>
        <stop offset="100%" stop-color="${cssVar('--down')}" stop-opacity="0.02"/>
      </linearGradient>
    </defs>
    <path d="${area}" fill="url(#gUp)" clip-path="url(#clipUp)"/>
    <path d="${area}" fill="url(#gDown)" clip-path="url(#clipDown)"/>
    <line x1="0" y1="${baseY}" x2="${W}" y2="${baseY}" stroke="${cssVar('--ink-muted')}"
          stroke-width="1" stroke-dasharray="5 5" vector-effect="non-scaling-stroke"/>
    <polyline points="${line}" fill="none" stroke="${stroke}" stroke-width="1.6"
              stroke-linejoin="round" vector-effect="non-scaling-stroke"/>
    <circle class="pingring" cx="${X(closes.length - 1)}" cy="${Y(last)}" r="3.5" fill="${stroke}"/>
    <circle cx="${X(closes.length - 1)}" cy="${Y(last)}" r="3" fill="${stroke}"
            vector-effect="non-scaling-stroke"/>`;

  document.querySelectorAll('.ylab').forEach((e) => e.remove());
  const wrap = document.getElementById('chartWrap');
  [[prev, '昨收 ' + nf(prev)], [hi - pad, nf(hi - pad)], [lo + pad, nf(lo + pad)]]
    .forEach(([v, text]) => {
      const el = document.createElement('span');
      el.className = 'ylab';
      el.style.top = ((Y(v) / H) * 100).toFixed(2) + '%';
      el.textContent = text;
      wrap.appendChild(el);
    });

  const xrow = document.getElementById('xrow');
  xrow.innerHTML = s.labels
    .map(([pct, t]) => `<span class="xlab" style="left:${Math.min(98, Math.max(2, pct))}%">${t}</span>`)
    .join('');
}

function drawStats() {
  const last = D.d1.c[D.d1.c.length - 1], prev = D.prev;
  const chg = prev === null ? null : last - prev;
  const pct = prev === null ? null : (chg / prev) * 100;
  const cells = [
    ['開盤', nf(D.open), ''],
    ['最高', nf(D.high), ''],
    ['最低', nf(D.low), ''],
    ['昨收', nf(prev), ''],
    ['漲跌點數', chg === null ? '—' : sign(chg) + nf(chg), dirClass(chg)],
    ['漲跌幅', pct === null ? '—' : sign(pct) + nf(pct) + '%', dirClass(pct)],
  ];
  document.getElementById('stats').innerHTML = cells
    .map(([k, v, c]) => `<div class="cell"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`)
    .join('');

  document.getElementById('heroVal').textContent = nf(last);
  const hc = document.getElementById('heroChg');
  hc.className = 'chg ' + dirClass(chg);
  hc.textContent = chg === null ? '—' : `${sign(chg)}${nf(chg)}　${sign(pct)}${nf(pct)}%`;
  document.getElementById('asOf').textContent = D.asOf;
  document.getElementById('statNote').textContent =
    '最高與最低取自逐分 OHLC，不是收盤價序列的極值 —— 兩者在今日相差 53.2 點。';
}

function drawKpis() {
  const k = D.kpi;
  document.getElementById('kpiDate').textContent = k.date + '（最近交易日）';
  const items = [
    ['成交金額', oku(k.tradeValueTwd) + ' 億', ''],
    ['加權指數', nf(k.taiex), sign(k.changePoints) + nf(k.changePoints) + ' 點'],
    ['三大法人買賣超', sign(k.instTotal) + oku(k.instTotal) + ' 億', ''],
    ['其中外資', sign(k.instForeign) + oku(k.instForeign) + ' 億', ''],
  ];
  document.getElementById('kpis').innerHTML = items
    .map(([kk, v, s], i) => {
      const cls = i === 1 ? dirClass(k.changePoints) : i >= 2 ? dirClass(k.instTotal) : '';
      return `<div class="glass kpi"><div class="k">${kk}</div>
        <div class="v ${cls}">${v}</div><div class="s ${cls}">${s}</div></div>`;
    })
    .join('');
}

function drawCandles() {
  const cs = D.candles, W = 1000, H = 220;
  const lo0 = Math.min(...cs.map((c) => c[3])), hi0 = Math.max(...cs.map((c) => c[2]));
  const pad = (hi0 - lo0) * 0.08, lo = lo0 - pad, hi = hi0 + pad;
  const Y = (v) => H - ((v - lo) * H) / (hi - lo);
  const step = W / cs.length, bw = Math.max(3, step * 0.56);
  const up = cssVar('--up'), down = cssVar('--down'), grid = cssVar('--grid');
  let out = '';
  for (let g = 1; g < 4; g++) {
    const y = (H * g) / 4;
    out += `<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="${grid}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
  }
  cs.forEach((c, i) => {
    const [, o, h, l, cl] = c;
    const x = i * step + step / 2, col = cl >= o ? up : down;
    const yo = Y(o), yc = Y(cl);
    out += `<line x1="${x}" y1="${Y(h)}" x2="${x}" y2="${Y(l)}" stroke="${col}" stroke-width="1" vector-effect="non-scaling-stroke"/>`;
    out += `<rect x="${x - bw / 2}" y="${Math.min(yo, yc)}" width="${bw}" height="${Math.max(1.5, Math.abs(yc - yo))}" fill="${col}"/>`;
  });
  document.getElementById('candles').innerHTML = out;

  const tv = cs.map((c) => c[5]), tmax = Math.max(...tv), HT = 80;
  document.getElementById('turnover').innerHTML = cs
    .map((c, i) => {
      const x = i * step + step / 2, h = (c[5] / tmax) * (HT - 6);
      const col = c[4] >= c[1] ? up : down;
      return `<rect x="${x - bw / 2}" y="${HT - h}" width="${bw}" height="${h}" fill="${col}" opacity="0.55"/>`;
    })
    .join('');
}

function renderAll() { drawChart(); drawStats(); drawKpis(); drawCandles(); }

document.querySelectorAll('.rangebtn').forEach((b) =>
  b.addEventListener('click', () => {
    range = b.dataset.range;
    document.querySelectorAll('.rangebtn').forEach((x) =>
      x.setAttribute('aria-pressed', String(x === b)));
    drawChart();
  }));

const markBtn = document.getElementById('markBtn');
document.body.classList.add('mark');
markBtn.addEventListener('click', () => {
  const on = document.body.classList.toggle('mark');
  markBtn.setAttribute('aria-pressed', String(on));
});

const themeBtn = document.getElementById('themeBtn');
themeBtn.addEventListener('click', () => {
  const root = document.documentElement;
  const nowLight = root.getAttribute('data-theme') !== 'light';
  root.setAttribute('data-theme', nowLight ? 'light' : 'dark');
  themeBtn.setAttribute('aria-pressed', String(nowLight));
  themeBtn.textContent = nowLight ? '切換深色' : '切換淺色';
  renderAll();
});

let t;
window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(drawChart, 120); });
renderAll();
</script>
