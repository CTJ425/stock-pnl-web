name: Sync GitHub Releases

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "releases"
  cancel-in-progress: false

jobs:
  sync-releases:
    name: Sync Releases from CHANGELOG
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Sync Releases
        run: node sources/scripts/sync-github-releases.cjs --all
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
